name: Cloudflare

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_BASE_PATH: ""
      NEXT_PUBLIC_COMMUNICATIONS_BACKEND_URL: ""
      NEXT_PUBLIC_SITE_URL: https://aureformui.com
      NEXT_TELEMETRY_DISABLED: 1
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:public
      - run: pnpm verify:changelog
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: npm ci --prefix examples/communications-backend --ignore-scripts
      - run: pnpm verify:communications-backend
      - run: pnpm verify:examples
      - run: pnpm verify:integrations
      - run: pnpm verify:communications-design
      - run: pnpm build:cloudflare
      - run: pnpm verify:pages
      - name: Check the prebuilt deployment
        run: pnpm exec cf deploy --prebuilt --dry-run
      - name: Install browser for website checks
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:website
      - run: pnpm verify:integrations-ui
      - run: pnpm verify:communications-ui
      - name: Verify the public source download
        if: github.event_name != 'pull_request'
        run: pnpm verify:cloudflare-release
      - name: Deploy the checked build
        if: github.event_name != 'pull_request'
        run: pnpm deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
