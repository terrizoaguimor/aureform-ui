name: Lighthouse quality

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full SHA of the production build to audit
        required: true
        type: string
      target_origin:
        description: Public HTTPS production origin
        required: true
        default: https://aureformui.com
        type: string
  workflow_run:
    workflows: [Cloudflare]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: lighthouse-production
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_commit }}
      TARGET_ORIGIN: ${{ github.event_name == 'workflow_run' && 'https://aureformui.com' || inputs.target_origin }}
      NEXT_TELEMETRY_DISABLED: 1
      NPM_CONFIG_USERCONFIG: /dev/null
      QUALITY_RUNNER_IMAGE: ubuntu-24.04
    steps:
      - name: Validate the requested source identity
        run: |
          node -e 'if (!/^[0-9a-f]{40}$/.test(process.env.SOURCE_COMMIT) || /^0+$/.test(process.env.SOURCE_COMMIT)) { throw new Error("A full known source SHA is required"); }'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            tools/lighthouse/pnpm-lock.yaml
      - name: Install root and isolated frozen dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tools/lighthouse install --frozen-lockfile --ignore-scripts
      - name: Check tooling contracts
        run: pnpm test:quality
      - name: Install the root pinned Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Collect all 18 public audits
        run: |
          pnpm quality:collect --source-commit "$SOURCE_COMMIT" --origin "$TARGET_ORIGIN" --id "production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --output artifacts/quality/lighthouse/collection
          pnpm quality:verify --bundle artifacts/quality/lighthouse/collection --source-commit "$SOURCE_COMMIT"
      - name: Add the verified snapshot to the job summary
        if: success()
        run: cat artifacts/quality/lighthouse/collection/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reports and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality/lighthouse/collection/
          if-no-files-found: warn
          retention-days: 90
