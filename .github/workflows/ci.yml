name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_BASE_PATH: /aureform-ui
      NEXT_PUBLIC_COMMUNICATIONS_BACKEND_URL: ""
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:public
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: npm ci --prefix examples/communications-backend --ignore-scripts
      - run: pnpm verify:communications-backend
      - run: pnpm verify:examples
      - run: pnpm verify:communications-design
      - run: pnpm build
      - run: pnpm verify:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:communications-ui
